# Evolution API para DCM (cliente DevEx Consulting).
# Pensado para el despliegue por Git de DCM: DCM resuelve este archivo, rechaza
# container_name / redes o volúmenes "external" / bind mounts / puertos públicos y
# genera su propio compose (red aislada por despliegue, puertos solo en 127.0.0.1).
# Por eso aquí NO hay `ports`, `container_name`, `env_file` ni `networks`.
# Todos los secretos llegan como variables del panel DCM (nunca en este repositorio).

services:
  api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    # El manager de la imagen solo lista contactos @s.whatsapp.net y los chats privados nuevos llegan
    # como @lid: se parchea al arrancar para listarlos y mostrar su número real. Si cambia la versión
    # de la imagen, el sed deja de coincidir sin romper nada. Migraciones y start:prod son el ENTRYPOINT
    # original. El SQL une a cada persona en un solo chat: guarda los @lid bajo su número real y deja el
    # identificador anterior en key.previousRemoteJid. "$$" es un "$" literal para compose.
    entrypoint:
      - /bin/bash
      - -c
      - |
        sed -i \
          -e 's#C\.remoteJid\.includes("@s\.whatsapp\.net")#["@s.whatsapp.net","@lid"].some(x=>C.remoteJid.endsWith(x))#g' \
          -e 's#chat-description block text-xs text-gray-500",children:C\.remoteJid\.split#chat-description block text-xs text-gray-500",children:(C.lastMessage?.key?.remoteJidAlt||C.remoteJid).split#g' \
          manager/dist/assets/index-*.js
        . ./Docker/scripts/deploy_database.sh || exit 1
        npx prisma db execute --url "$$DATABASE_CONNECTION_URI" --stdin <<'SQL' || echo "No se pudo instalar la unificación de @lid"
        CREATE OR REPLACE FUNCTION unificar_lid() RETURNS trigger AS $$$$
        BEGIN
          IF NEW."key"->>'remoteJid' LIKE '%@lid' AND NEW."key"->>'remoteJidAlt' LIKE '%@s.whatsapp.net' THEN
            NEW."key" := NEW."key" || jsonb_build_object('previousRemoteJid', NEW."key"->>'remoteJid', 'remoteJid', NEW."key"->>'remoteJidAlt');
          END IF;
          RETURN NEW;
        END;
        $$$$ LANGUAGE plpgsql;
        DROP TRIGGER IF EXISTS unificar_lid ON "Message";
        CREATE TRIGGER unificar_lid BEFORE INSERT ON "Message" FOR EACH ROW EXECUTE FUNCTION unificar_lid();
        UPDATE "Message"
        SET "key" = "key" || jsonb_build_object('previousRemoteJid', "key"->>'remoteJid', 'remoteJid', "key"->>'remoteJidAlt')
        WHERE "key"->>'remoteJid' LIKE '%@lid' AND "key"->>'remoteJidAlt' LIKE '%@s.whatsapp.net';
        SQL
        npm run start:prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # DCM detecta el servicio web (y le crea el dominio HTTPS) a partir de los `ports` del
      # compose. Solo se declara el puerto interno: DCM lo publica en 127.0.0.1 con un puerto
      # aleatorio y Traefik entra por la red privada. NO se abre nada al exterior.
      - "8080"
    labels:
      # Una sola sesión de WhatsApp: nunca dos copias de la API a la vez durante un redeploy.
      dcm.overlap: stop-blue-before-start
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      SERVER_URL: ${SERVER_URL:?defínela en el panel DCM (https://<dominio>)}
      # "*" es obligatorio: con una lista de orígenes Evolution responde 500 "Not allowed by CORS"
      # a toda petición SIN cabecera Origin (healthcheck, curl, Traefik, otros servidores).
      # La API sigue protegida por la apikey.
      CORS_ORIGIN: "*"
      CORS_METHODS: GET,POST,PUT,DELETE
      CORS_CREDENTIALS: "true"

      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY:?defínela en el panel DCM}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"

      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD:?defínela en el panel DCM}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_dcm
      DATABASE_SAVE_DATA_INSTANCE: "true"
      # El chat del manager lee de PostgreSQL: sin estas variables se ve vacío.
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      # Guarda el historial que WhatsApp envía al escanear el QR.
      DATABASE_SAVE_DATA_HISTORIC: "true"
      DATABASE_SAVE_IS_ON_WHATSAPP: "true"
      DATABASE_SAVE_IS_ON_WHATSAPP_DAYS: "7"
      DATABASE_DELETE_MESSAGE: "true"

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD:?defínela en el panel DCM}@redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_TTL: "604800"
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"

      # Integraciones opcionales apagadas.
      DEL_INSTANCE: "false"
      # No usar WEBSOCKET_ALLOWED_HOSTS="*": el manager conecta sin apikey y, detrás de Traefik,
      # eso publicaría a internet los mensajes en vivo y el envío de nodos. El chat se actualiza al recargar.
      WEBSOCKET_ENABLED: "false"
      # Webhook solo de mensajes nuevos hacia el servicio `commands`, por la red privada.
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://commands:3000
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_RETRY_MAX_ATTEMPTS: "2"
      RABBITMQ_ENABLED: "false"
      SQS_ENABLED: "false"
      PUSHER_ENABLED: "false"
      S3_ENABLED: "false"
      CHATWOOT_ENABLED: "false"
      TYPEBOT_ENABLED: "false"
      OPENAI_ENABLED: "false"
      DIFY_ENABLED: "false"
      N8N_ENABLED: "false"
      EVOAI_ENABLED: "false"

      CONFIG_SESSION_PHONE_CLIENT: DevEx
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: "30"
      LANGUAGE: es
      LOG_LEVEL: ERROR,WARN,INFO
      LOG_BAILEYS: error
    volumes:
      - evolution_instances:/evolution/instances
    healthcheck:
      # Node ya viene en la imagen; no depende de curl/wget.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  # Comandos de WhatsApp. Recibe el webhook de la API por la red privada del despliegue:
  # sin `ports`, no es accesible desde internet. El script no usa "$" porque compose lo interpolaría.
  commands:
    image: node:22.21.1-alpine
    restart: unless-stopped
    environment:
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY:?defínela en el panel DCM}
    command:
      - node
      - -e
      - |
        // !revealId en un grupo: el número responde en ese grupo con su id (xxxxx@g.us).
        const http = require("http");

        function textOf(message) {
          const m = message?.ephemeralMessage?.message || message;
          return m?.conversation || m?.extendedTextMessage?.text || "";
        }

        async function handle(raw) {
          const { event, instance, data } = JSON.parse(raw);
          const jid = data?.key?.remoteJid;
          if (event !== "messages.upsert" || !jid?.endsWith("@g.us")) return;
          if (textOf(data.message).trim() !== "!revealId") return;

          const res = await fetch("http://api:8080/message/sendText/" + encodeURIComponent(instance), {
            method: "POST",
            headers: { "Content-Type": "application/json", apikey: process.env.AUTHENTICATION_API_KEY },
            body: JSON.stringify({ number: jid, text: jid }),
          });
          if (!res.ok) console.error("sendText " + res.status + ": " + (await res.text()));
        }

        http.createServer((req, res) => {
          if (req.method !== "POST") return res.end("ok");
          const chunks = [];
          req.on("data", (c) => chunks.push(c));
          req.on("end", () => {
            res.end("ok");
            handle(Buffer.concat(chunks).toString()).catch((e) => console.error(e.message));
          });
        }).listen(3000);

        process.on("SIGTERM", () => process.exit(0));
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:15.14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defínela en el panel DCM}
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defínela en el panel DCM}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  evolution_instances:
  postgres_data:
  redis_data:
